name: Cloudflare client cutover checks

on:
  push:
    paths:
      - "Word Guess/Network/**"
      - "tools/verify-cloudflare-cutover.mjs"
      - "tools/set-cloudflare-backend.mjs"
      - ".github/workflows/cloudflare-client-ci.yml"
  pull_request:
    paths:
      - "Word Guess/Network/**"
      - "tools/verify-cloudflare-cutover.mjs"
      - "tools/set-cloudflare-backend.mjs"
      - ".github/workflows/cloudflare-client-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify backend cutover contract
        run: node tools/verify-cloudflare-cutover.mjs
