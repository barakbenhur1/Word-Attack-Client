name: iOS build

on:
  push:
    paths:
      - "Word Guess/Network/**"
      - "Word Guess/AppDelegate.swift"
      - "Word Guess.xcodeproj/**"
      - "Word-Guess-Info.plist"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "Word Guess/Network/**"
      - "Word Guess/AppDelegate.swift"
      - "Word Guess.xcodeproj/**"
      - "Word-Guess-Info.plist"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build WordZap for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project "Word Guess.xcodeproj" \
            -scheme "Word Guess" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
